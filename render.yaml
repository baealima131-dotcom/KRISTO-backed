services:
  - type: web
    name: kristo-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: CLIENT_URL
        value: https://your-frontend-url.com
